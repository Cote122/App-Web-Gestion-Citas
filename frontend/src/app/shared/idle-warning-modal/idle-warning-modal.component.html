<div class="modal-backdrop">
  <div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="idle-title" aria-describedby="idle-message">
    <div class="ring" aria-live="polite">
      <svg viewBox="0 0 96 96" aria-hidden="true">
        <circle class="track" cx="48" cy="48" [attr.r]="radius"></circle>
        <circle class="progress" cx="48" cy="48" [attr.r]="radius"
                [attr.stroke-dasharray]="circumference" [attr.stroke-dashoffset]="dashOffset"></circle>
      </svg>
      <div class="value">
        <span class="number">{{ secondsLeft }}</span>
        <span class="unit">seg</span>
      </div>
    </div>

    <h3 id="idle-title">¿Sigues ahí?</h3>
    <p id="idle-message">Por seguridad, cerraremos tu sesión si no hay actividad.</p>

    <div class="actions">
      <button class="btn-leave" type="button" (click)="leave.emit()">Cerrar sesión</button>
      <button class="btn btn-stay" type="button" (click)="stay.emit()">Seguir conectado</button>
    </div>
  </div>
</div>
