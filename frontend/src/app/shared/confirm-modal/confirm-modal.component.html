<div class="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-head">
      <h3 id="confirm-title">{{ title }}</h3>
      <button class="modal-close" type="button" aria-label="Cerrar" (click)="onCancel()">×</button>
    </div>

    <div class="modal-body">
      <p style="margin-bottom: 16px; color: #64748b;">Por favor, revisa el resumen antes de agendar tu cita:</p>
      
      <div class="summary-list" *ngIf="datos">
        <div class="summary-row">
          <span>Especialidad:</span>
          <strong>{{ datos.especialidad }}</strong>
        </div>
        <div class="summary-row">
          <span>Médico:</span>
          <strong>{{ datos.medico }}</strong>
        </div>
        <div class="summary-row">
          <span>Fecha y Hora:</span>
          <strong>{{ datos.fecha }} - {{ datos.hora }}</strong>
        </div>
        <div class="summary-row" *ngIf="datos.motivo">
          <span>Motivo:</span>
          <strong>{{ datos.motivo }}</strong>
        </div>
      </div>
    </div>

    <div class="modal-foot" style="gap: 12px;">
      <button class="btn btn-secondary" type="button" (click)="onCancel()">{{ cancelText }}</button>
      <button class="btn btn-primary" type="button" (click)="onConfirm()">{{ confirmText }}</button>
    </div>
  </div>
</div>
