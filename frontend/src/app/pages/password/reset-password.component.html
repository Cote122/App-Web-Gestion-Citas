<section class="password-page">
  <div class="password-card">
    <a class="back" routerLink="/login">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Volver al inicio de sesión
    </a>

    <!-- Contraseña cambiada -->
    <ng-container *ngIf="done">
      <div class="icon-circle ok" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg>
      </div>
      <h1>Contraseña actualizada</h1>
      <p class="notice ok" role="status">{{ done }}</p>
      <div class="actions"><a class="btn btn-primary" routerLink="/login">Iniciar sesión</a></div>
    </ng-container>

    <!-- Enlace vencido, usado o inválido -->
    <ng-container *ngIf="!done && linkError">
      <div class="icon-circle bad" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v5"></path><path d="M12 16h.01"></path></svg>
      </div>
      <h1>Enlace no válido</h1>
      <p class="notice bad" role="alert">{{ linkError }}</p>
      <div class="actions"><a class="btn btn-primary" routerLink="/forgot-password">Solicitar un enlace nuevo</a></div>
    </ng-container>

    <!-- Nueva contraseña -->
    <ng-container *ngIf="!done && !linkError">
      <div class="icon-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      </div>
      <h1>Crea una nueva contraseña</h1>
      <p class="subtitle">Debe tener al menos 8 caracteres, con letras y números.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="form-field">
          <label for="password">Nueva contraseña</label>
          <div class="password-wrap">
            <input id="password" formControlName="password" [type]="showPasswords ? 'text' : 'password'" maxlength="64" autocomplete="new-password"
                   [class.invalid]="errorFor('password')" (focus)="onFocus('password')" (blur)="onBlur('password')">
            <ng-container *ngTemplateOutlet="eye"></ng-container>
          </div>
          <small class="field-error">{{ errorFor('password') }}</small>
        </div>

        <div class="form-field">
          <label for="confirmPassword">Confirmar contraseña</label>
          <div class="password-wrap">
            <input id="confirmPassword" formControlName="confirmPassword" [type]="showPasswords ? 'text' : 'password'" maxlength="64" autocomplete="new-password"
                   [class.invalid]="errorFor('confirmPassword')" (focus)="onFocus('confirmPassword')" (blur)="onBlur('confirmPassword')">
            <ng-container *ngTemplateOutlet="eye"></ng-container>
          </div>
          <small class="field-error">{{ errorFor('confirmPassword') || error }}</small>
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="loading">{{ loading ? 'Guardando...' : 'Guardar contraseña' }}</button>
      </form>
    </ng-container>

    <!-- Ojito: muestra u oculta las dos contraseñas a la vez -->
    <ng-template #eye>
      <button type="button" class="eye" (click)="showPasswords = !showPasswords"
              [attr.aria-label]="showPasswords ? 'Ocultar contraseñas' : 'Mostrar contraseñas'" [attr.aria-pressed]="showPasswords">
        <svg *ngIf="!showPasswords" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle>
        </svg>
        <svg *ngIf="showPasswords" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 3l18 18"></path><path d="M10.6 5.1A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2"></path>
          <path d="M6.6 6.6C3.9 8.4 2 12 2 12s3.5 7 10 7a9.9 9.9 0 0 0 5.4-1.6"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path>
        </svg>
      </button>
    </ng-template>
  </div>
</section>
