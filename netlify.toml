[build]
  base = "frontend"
  command = "npm run build -- --configuration production"
  publish = "dist/gestion-citas-web/browser"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "https://app-web-gestion-citas.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200