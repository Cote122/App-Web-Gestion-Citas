name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_PID: Developer
          # Credencial pública de un contenedor efímero de pruebas; no se usa en ningún hosting.
          MSSQL_SA_PASSWORD: Hu18_TestOnly_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Hu18_TestOnly_2026!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
    env:
      CI_SQLSERVER_CONNECTION: 'Server=localhost,1433;User Id=sa;Password=Hu18_TestOnly_2026!;Encrypt=True;TrustServerCertificate=True;Connect Timeout=30'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore backend/GestionCitas.Api/GestionCitas.Api.csproj
      - run: dotnet build backend/GestionCitas.Api/GestionCitas.Api.csproj --configuration Release --no-restore
      - run: dotnet test backend/GestionCitas.Api.Tests/GestionCitas.Api.Tests.csproj --configuration Release

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build

